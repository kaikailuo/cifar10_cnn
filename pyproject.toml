[project]
name = "a2-cifar10-cnn"
version = "0.1.0"
description = "CNN experiments on CIFAR-10: dropout, normalization, cross-validation and extensions"
readme = "README.md"
requires-python = ">=3.10"
# PyTorch stopped shipping macOS x86_64 wheels after 2.2.2 (Python <= 3.12, built against NumPy 1.x).
# On the GPU server, use the image's preinstalled torch: `pip install -r requirements-gpu.txt`.
dependencies = [
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy>=1.26; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "matplotlib>=3.8,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
